<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Avalon</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
    font-family: "Vazirmatn", sans-serif;
    box-sizing: border-box;
}
body {
    margin: 0;
    direction: rtl;
    background: url("avalon.png") no-repeat center center/cover;
    color: white;
}
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
}
.container {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}
.logo {
    font-size: 42px;
    font-weight: 800;
    color: #f6d37a;
}
.title {
    font-size: 26px;
    color: #f6d37a;
}
.subtitle {
    font-size: 14px;
    opacity: 0.8;
    margin-bottom: 20px;
}
.menu-title {
    font-size: 24px;
    font-weight: bold;
    color: #f6d37a;
    margin-bottom: 30px;
    text-align: center;
    margin-top: 100px;
}
.card {
    width: 340px;
    background: rgba(15,20,35,0.75);
    backdrop-filter: blur(10px);
    padding: 20px;
    border-radius: 15px;
}
.input-box {
    position: relative;
}
input {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 10px;
    border: 2px solid transparent;
    background: #0e1528;
    color: white;
    transition: all 0.3s ease;
}
input:focus {
    outline: none;
    border-color: #f6d37a;
    box-shadow: 0 0 8px rgba(246, 211, 122, 0.4);
}
.eye {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    opacity: 0.4;
    transition: 0.2s;
}
.eye.showing {
    opacity: 1;
}
.eye svg {
    width: 24px;
    height: 24px;
}
.slash {
    transition: 0.2s;
}
.eye.showing .slash {
    opacity: 0;
}
button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-weight: bold;
}
.main-btn {
    background: linear-gradient(90deg, #d6a94d, #f6d37a);
    color: #1a1a1a;
}
.sec-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    color: white;
}
#createBtn {
    background: linear-gradient(90deg, #d6a94d, #f6d37a);
    color: #1a1a1a;
}
.toast {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 14px;
    opacity: 0;
    transform: translateY(-10px);
    transition: 0.3s;
    z-index: 999;
}
.toast.show {
    opacity: 1;
    transform: translateY(0);
}
.hidden {
    display: none;
}
#lobbyPage {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: url("avalon.png") no-repeat center center/cover;
    overflow-y: auto;
    padding: 20px 0;
}
#lobbyPage button {
    width: 220px;
    padding: 14px 25px;
    margin: 12px auto;
    display: block;
    font-size: 16px;
    font-weight: bold;
    font-family: "Vazirmatn", sans-serif;
    transition: all 0.3s ease;
    background: linear-gradient(135deg, #2a2f45, #1a1f35);
    border: 2px solid rgba(246, 211, 122, 0.4);
    color: #f6d37a;
    cursor: pointer;
    text-align: center;
}
#lobbyPage.room-active {
    background: #0a0e1a !important;
}
#lobbyPage.room-active .room-container {
    margin: 0;
    width: 100%;
    height: 100vh;
    border-radius: 0;
    background: linear-gradient(135deg, #0a0e1a, #12172a);
}
#lobbyPage button:first-of-type {
    background: linear-gradient(135deg, #f6d37a, #d6a94d);
    color: #1a1a1a;
    border: none;
    box-shadow: 0 4px 15px rgba(246, 211, 122, 0.3);
}
#lobbyPage button:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(246, 211, 122, 0.4);
}
#lobbyPage button:first-of-type:hover {
    background: linear-gradient(135deg, #ffe08a, #e6b94d);
    box-shadow: 0 10px 25px rgba(246, 211, 122, 0.6);
}
#lobbyPage button:nth-of-type(2),
#lobbyPage button:nth-of-type(3) {
    background: rgba(20, 25, 45, 0.8);
    backdrop-filter: blur(5px);
}
#lobbyPage button:nth-of-type(2):hover,
#lobbyPage button:nth-of-type(3):hover {
    background: linear-gradient(135deg, #f6d37a, #d6a94d);
    color: #1a1a1a;
    border-color: transparent;
}
.lobby-logo {
    position: fixed;
    top: 0;
    left: -20px;
    z-index: 10;
}
.lobby-logo img {
    width: 200px;
}
.menu-icons {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    gap: 20px;
    z-index: 20;
}
.icon {
    cursor: pointer;
    transition: all 0.3s ease;
    width: 32px;
    height: 32px;
    opacity: 0.7;
}
.icon:hover {
    opacity: 1;
    transform: scale(1.1);
}
.icon svg {
    width: 100%;
    height: 100%;
    stroke: #f6d37a;
    stroke-width: 1.8;
    fill: none;
}
.room-container {
    background: rgba(15, 20, 35, 0.85);
    backdrop-filter: blur(15px);
    border-radius: 25px;
    padding: 30px;
    width: 400px;
    border: 1px solid rgba(246, 211, 122, 0.3);
    margin: 20px auto;
}
.room-header {
    text-align: center;
    margin-bottom: 25px;
}
.room-icon {
    font-size: 50px;
}
.room-title {
    font-size: 28px;
    font-weight: bold;
    color: #f6d37a;
}
.room-code-section {
    background: rgba(0, 0, 0, 0.4);
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 25px;
    text-align: center;
}
.code-label {
    font-size: 14px;
    color: #aaa;
    margin-bottom: 10px;
}
.code-box {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    margin-bottom: 10px;
}
.room-code {
    font-size: 32px;
    font-weight: bold;
    font-family: monospace;
    color: #f6d37a;
    letter-spacing: 3px;
    background: #0e1528;
    padding: 10px 20px;
    border-radius: 12px;
}
.copy-btn {
    background: #f6d37a;
    color: #1a1a1a;
    padding: 10px 18px;
    border-radius: 10px;
    margin: 0;
    width: auto;
}
.copy-btn:hover {
    background: #ffe08a;
    transform: scale(1.05);
}
.code-hint {
    font-size: 12px;
    color: #aaa;
}
.players-section {
    background: rgba(0, 0, 0, 0.3);
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 25px;
}
.players-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
    color: #f6d37a;
    font-weight: bold;
}
.players-list {
    max-height: 200px;
    overflow-y: auto;
}
.player-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    margin-bottom: 8px;
}
.player-item.host {
    background: rgba(246, 211, 122, 0.1);
    border: 1px solid rgba(246, 211, 122, 0.3);
}
.host-badge {
    background: #f6d37a;
    color: #1a1a1a;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 10px;
    margin-right: auto;
}
.room-settings {
    background: rgba(0, 0, 0, 0.3);
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 25px;
}
.join-room-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(8px);
    z-index: 200;
    display: flex;
    justify-content: center;
    align-items: center;
}
.join-room-card {
    background: rgba(15, 20, 35, 0.95);
    border-radius: 25px;
    padding: 35px;
    width: 350px;
    text-align: center;
    border: 1px solid rgba(246, 211, 122, 0.3);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    animation: fadeInUp 0.3s ease;
}
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
.join-room-card .room-icon {
    font-size: 50px;
    margin-bottom: 10px;
}
.join-room-card .room-title {
    font-size: 24px;
    color: #f6d37a;
    margin-bottom: 25px;
}
.join-input {
    width: 100%;
    padding: 14px;
    font-size: 24px;
    text-align: center;
    letter-spacing: 5px;
    font-family: monospace;
    background: #0e1528;
    border: 2px solid rgba(246, 211, 122, 0.3);
    border-radius: 12px;
    color: #f6d37a;
    margin-bottom: 20px;
    direction: ltr;
}
.join-input:focus {
    outline: none;
    border-color: #f6d37a;
}
.join-buttons {
    display: flex;
    gap: 15px;
    margin-top: 10px;
}
.join-buttons button {
    flex: 1;
    padding: 12px;
    font-size: 14px;
}
.close-join {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: white;
}
.code-hint-join {
    font-size: 12px;
    color: #aaa;
    margin-top: 15px;
}
.setting-row {
    color: #f6d37a;
    font-weight: bold;
    margin-bottom: 15px;
}
.setting-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.setting-select {
    background: #0e1528;
    color: white;
    border: 1px solid #f6d37a;
    border-radius: 8px;
    padding: 5px 10px;
    cursor: pointer;
}
.room-actions {
    display: flex;
    gap: 15px;
    margin-top: 20px;
}
.start-btn, .leave-btn {
    flex: 1;
    padding: 12px;
    font-weight: bold;
}
.start-btn {
    background: linear-gradient(90deg, #f6d37a, #d6a94d);
    color: #1a1a1a;
}
.start-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
.leave-btn {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
}
.test-join-area {
    margin-top: 20px;
    padding: 15px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 12px;
    text-align: center;
}
.test-hint {
    font-size: 12px;
    color: #aaa;
    margin-bottom: 8px;
}
.test-join-button {
    width: 100%;
    background: rgba(246, 211, 122, 0.1);
    border: 1px dashed rgba(246, 211, 122, 0.5);
    color: #f6d37a;
    padding: 8px;
    font-size: 13px;
    border-radius: 8px;
    cursor: pointer;
}
.test-join-button:hover {
    background: rgba(246, 211, 122, 0.2);
    transform: translateY(-2px);
}
html {
    scroll-behavior: smooth;
}
</style>
</head>
<body>

<div id="loginPage">
    <div class="overlay"></div>
    <div id="toast" class="toast"></div>
    <div class="container">
        <div class="logo">AVALON</div>
        <div class="title">به دنیای آوالون خوش آمدید</div>
        <div class="subtitle">جایی که وفاداری و خیانت در کنار هم بازی می‌کنند</div>
        <div class="card">
            <input id="username" placeholder="نام کاربری">
            <div class="input-box">
                <input id="pass" type="password" placeholder="رمز عبور">
                <span class="eye" onclick="togglePass(this)">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" stroke="white" stroke-width="1.8"/>
                        <circle cx="12" cy="12" r="3.5" stroke="white" stroke-width="1.8"/>
                        <line class="slash" x1="4" y1="20" x2="20" y2="4" stroke="white" stroke-width="2"/>
                    </svg>
                </span>
            </div>
            <button id="loginBtn" class="main-btn" onclick="login()">ورود</button>
            <button id="registerBtn" class="sec-btn" onclick="showRegister()">ثبت نام</button>
            <button id="createBtn" class="sec-btn hidden" onclick="createAccount()">ساخت حساب</button>
            <button id="backBtn" class="sec-btn hidden" onclick="backToLogin()">بازگشت</button>
        </div>
    </div>
</div>

<div id="lobbyPage" style="display:none;">
    <div class="lobby-logo">
        <img src="avalon-logo.png" onerror="this.style.display='none'">
    </div>
    <div class="menu-title">منوی بازی</div>
    <button onclick="createRoom()">🏰 ساخت اتاق</button>
    <button onclick="showJoinRoom()">🔗 پیوستن به اتاق</button>
    <button>⚡ بازی سریع</button>
    <div class="menu-icons">
        <div class="icon" onclick="openShop()">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4H6z" stroke="#f6d37a" stroke-width="1.8"/>
                <path d="M3 6h18" stroke="#f6d37a" stroke-width="1.8"/>
                <path d="M16 10a4 4 0 0 1-8 0" stroke="#f6d37a" stroke-width="1.8"/>
            </svg>
        </div>
        <div class="icon" onclick="openSettings()">
            <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="3" stroke="#f6d37a" stroke-width="1.8"/>
                <path d="M12 5.5V2M12 22v-3.5M18.5 12H22M2 12h3.5M16.5 7.5L19 5M5 19l2.5-2.5M7.5 7.5L5 5M19 19l-2.5-2.5" stroke="#f6d37a" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
        </div>
    </div>
</div>

<script>
let currentUser = null;

function togglePass(el) {
    let input = document.getElementById("pass");
    if (input.type === "password") {
        input.type = "text";
        el.classList.add("showing");
    } else {
        input.type = "password";
        el.classList.remove("showing");
    }
}

function showToast(msg, type = "success") {
    let t = document.getElementById("toast");
    t.innerText = msg;
    t.style.background = type === "error" ? "#ef4444" : "#22c55e";
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2000);
}

function showRegister() {
    document.getElementById("loginBtn").style.display = "none";
    document.getElementById("registerBtn").style.display = "none";
    document.getElementById("createBtn").classList.remove("hidden");
    document.getElementById("backBtn").classList.remove("hidden");
}

function backToLogin() {
    document.getElementById("loginBtn").style.display = "block";
    document.getElementById("registerBtn").style.display = "block";
    document.getElementById("createBtn").classList.add("hidden");
    document.getElementById("backBtn").classList.add("hidden");
}

function createAccount() {
    let username = document.getElementById("username").value;
    let password = document.getElementById("pass").value;
    if (!username || !password) {
        showToast("لطفاً همه فیلدها را پر کنید", "error");
        return;
    }
    let users = JSON.parse(localStorage.getItem("users") || "[]");
    if (users.find(u => u.username === username)) {
        showToast("این کاربر وجود دارد", "error");
        return;
    }
    users.push({ username, password });
    localStorage.setItem("users", JSON.stringify(users));
    showToast("ثبت نام موفق ✔", "success");
    setTimeout(() => backToLogin(), 1200);
}

function login() {
    let username = document.getElementById("username").value;
    let password = document.getElementById("pass").value;
    let users = JSON.parse(localStorage.getItem("users") || "[]");
    let found = users.find(u => u.username === username && u.password === password);
    if (!found) {
        showToast("اطلاعات وارد شده اشتباه است ❌", "error");
        return;
    }
    currentUser = username;
    localStorage.setItem("currentUser", username);
    showToast("ورود با موفقیت انجام شد ✔", "success");
    setTimeout(() => {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("lobbyPage").style.display = "block";
    }, 800);
}

function openShop() {
    showToast("فروشگاه در حال راه‌اندازی...", "success");
}

function openSettings() {
    showToast("تنظیمات در حال راه‌اندازی...", "success");
}

function createRoom() {
    document.querySelector('.menu-title').style.display = 'none';
    document.querySelectorAll('#lobbyPage > button').forEach(btn => btn.style.display = 'none');
    const roomCode = Math.floor(100000 + Math.random() * 900000);
    const rooms = JSON.parse(localStorage.getItem('rooms') || '{}');
    rooms[roomCode] = {
        creator: localStorage.getItem('currentUser') || 'میزبان',
        players: [localStorage.getItem('currentUser') || 'میزبان'],
        maxPlayers: 8,
        createdAt: Date.now()
    };
    localStorage.setItem('rooms', JSON.stringify(rooms));
    localStorage.setItem('currentRoom', roomCode);
    showRoomPage(roomCode);
}

function showRoomPage(roomCode) {
    const lobbyPage = document.getElementById('lobbyPage');
    const username = localStorage.getItem('currentUser') || 'میزبان';
    lobbyPage.classList.add('room-active');
    lobbyPage.innerHTML = `
        <div class="lobby-logo"><img src="avalon-logo.png" onerror="this.style.display='none'"></div>
        <div class="room-container">
            <div class="room-header">
                <div class="room-icon">🏰</div>
                <div class="room-title">اتاق بازی</div>
            </div>
            <div class="room-code-section">
                <div class="code-label">کد اتاق</div>
                <div class="code-box">
                    <span class="room-code" id="roomCode">${roomCode}</span>
                    <button class="copy-btn" onclick="copyRoomCode()">📋 کپی</button>
                </div>
                <div class="code-hint">این کد رو با دوستانت به اشتراک بگذار</div>
            </div>
            <div class="players-section">
                <div class="players-header">
                    <span>👥 بازیکنان</span>
                    <span class="players-count" id="playersCount">1/8</span>
                </div>
                <div class="players-list" id="playersList">
                    <div class="player-item host">
                        <span>👑</span>
                        <span>${username}</span>
                        <span class="host-badge">میزبان</span>
                    </div>
                </div>
            </div>
            <div class="room-settings">
                <div class="setting-row">⚙️ تنظیمات اتاق</div>
                <div class="setting-item">
                    <span>تعداد بازیکنان:</span>
                    <select id="maxPlayers" class="setting-select" onchange="updatePlayersCount()">
                        <option value="6">6 نفر</option>
                        <option value="8" selected>8 نفر</option>
                        <option value="10">10 نفر</option>
                    </select>
                </div>
            </div>
            <div class="room-actions">
                <button class="start-btn" id="startGameBtn" onclick="startGame()" disabled>🚀 شروع بازی</button>
                <button class="leave-btn" onclick="leaveRoom()">🚪 خروج از اتاق</button>
            </div>
            <div class="test-join-area">
                <div class="test-hint">💡 برای تست، بازیکن جدید اضافه کن</div>
                <button class="test-join-button" onclick="addTestPlayer()">➕ اضافه کردن بازیکن تستی</button>
            </div>
        </div>
    `;
    updatePlayersCount();
}

function updatePlayersCount() {
    const maxPlayers = document.getElementById('maxPlayers');
    if (!maxPlayers) return;
    const playersList = document.getElementById('playersList');
    const currentPlayers = playersList ? playersList.children.length : 1;
    const playersCountSpan = document.getElementById('playersCount');
    const startBtn = document.getElementById('startGameBtn');
    if (playersCountSpan) {
        playersCountSpan.innerText = `${currentPlayers}/${maxPlayers.value}`;
    }
    if (startBtn) {
        if (currentPlayers >= parseInt(maxPlayers.value)) {
            startBtn.disabled = false;
            startBtn.style.opacity = '1';
        } else {
            startBtn.disabled = true;
            startBtn.style.opacity = '0.5';
        }
    }
}

function addTestPlayer() {
    const playersList = document.getElementById('playersList');
    const maxPlayers = document.getElementById('maxPlayers');
    if (!playersList || !maxPlayers) return;
    const currentPlayers = playersList.children.length;
    const max = parseInt(maxPlayers.value);
    if (currentPlayers >= max) {
        showToast('❌ ظرفیت اتاق پر شده!', 'error');
        return;
    }
    const testNames = ['سارا', 'علی', 'مریم', 'رضا', 'نرگس', 'حمید', 'زهرا', 'مهدی', 'لیلا', 'حسین'];
    const usedNames = Array.from(playersList.children).map(child => {
        const text = child.innerText;
        return text.split(' ')[1] || text.split(' ')[0];
    });
    const availableNames = testNames.filter(n => !usedNames.includes(n));
    const randomName = availableNames.length ? availableNames[0] : `بازیکن ${currentPlayers + 1}`;
    const newPlayer = document.createElement('div');
    newPlayer.className = 'player-item';
    newPlayer.innerHTML = `<span>🪄</span><span>${randomName}</span>`;
    playersList.appendChild(newPlayer);
    updatePlayersCount();
    showToast(`${randomName} به اتاق پیوست ✅`, 'success');
}

function copyRoomCode() {
    const roomCode = document.getElementById('roomCode');
    if (roomCode) {
        navigator.clipboard.writeText(roomCode.innerText);
        showToast('✅ کد اتاق کپی شد!', 'success');
    }
}

function showJoinRoom() {
    const overlay = document.createElement('div');
    overlay.className = 'join-room-overlay';
    overlay.id = 'joinOverlay';
    overlay.innerHTML = `
        <div class="join-room-card">
            <div class="room-icon">🔗</div>
            <div class="room-title">پیوستن به اتاق</div>
            <input type="text" id="joinRoomCode" class="join-input" placeholder="کد 6 رقمی" maxlength="6" autocomplete="off">
            <div class="join-buttons">
                <button class="main-btn" onclick="submitJoinRoom()">✅ پیوستن</button>
                <button class="close-join" onclick="closeJoinModal()">❌ انصراف</button>
            </div>
            <div class="code-hint-join">کد اتاق رو از میزبان دریافت کن</div>
        </div>
    `;
    document.body.appendChild(overlay);
    setTimeout(() => {
        const input = document.getElementById('joinRoomCode');
        if (input) input.focus();
    }, 100);
}

function closeJoinModal() {
    const overlay = document.getElementById('joinOverlay');
    if (overlay) overlay.remove();
}

function submitJoinRoom() {
    const roomCode = document.getElementById('joinRoomCode').value.trim();
    if (!roomCode) {
        showToast('لطفاً کد اتاق را وارد کن', 'error');
        return;
    }
    if (roomCode.length !== 6 || isNaN(roomCode)) {
        showToast('کد اتاق باید 6 رقم باشد', 'error');
        return;
    }
    const rooms = JSON.parse(localStorage.getItem('rooms') || '{}');
    const room = rooms[roomCode];
    if (room) {
        closeJoinModal();
        localStorage.setItem('currentRoom', roomCode);
        const currentUser = localStorage.getItem('currentUser') || 'مهمان';
        if (!room.players.includes(currentUser)) {
            room.players.push(currentUser);
            rooms[roomCode] = room;
            localStorage.setItem('rooms', JSON.stringify(rooms));
        }
        showToast(`✅ وارد شدن به اتاق ${roomCode}`, 'success');
        enterRoom(roomCode);
    } else {
        showToast('❌ کد اتاق اشتباه است!', 'error');
        document.getElementById('joinRoomCode').value = '';
        document.getElementById('joinRoomCode').focus();
    }
}

function enterRoom(roomCode) {
    const lobbyPage = document.getElementById('lobbyPage');
    const rooms = JSON.parse(localStorage.getItem('rooms') || '{}');
    const room = rooms[roomCode];
    if (!room) {
        showToast('❌ اتاق وجود ندارد!', 'error');
        return;
    }
    const menuTitle = document.querySelector('.menu-title');
    const menuButtons = document.querySelectorAll('#lobbyPage > button');
    if (menuTitle) menuTitle.style.display = 'none';
    menuButtons.forEach(btn => btn.style.display = 'none');
    lobbyPage.classList.add('room-active');
    let playersHtml = '';
    room.players.forEach((player, index) => {
        const isHost = index === 0;
        playersHtml += `
            <div class="player-item ${isHost ? 'host' : ''}">
                <span>${isHost ? '👑' : '🪄'}</span>
                <span>${player}</span>
                ${isHost ? '<span class="host-badge">میزبان</span>' : ''}
            </div>
        `;
    });
    lobbyPage.innerHTML = `
        <div class="lobby-logo"><img src="avalon-logo.png" onerror="this.style.display='none'"></div>
        <div class="room-container">
            <div class="room-header">
                <div class="room-icon">🏰</div>
                <div class="room-title">اتاق بازی</div>
            </div>
            <div class="room-code-section">
                <div class="code-label">کد اتاق</div>
                <div class="code-box">
                    <span class="room-code" id="roomCode">${roomCode}</span>
                    <button class="copy-btn" onclick="copyRoomCode()">📋 کپی</button>
                </div>
                <div class="code-hint">این کد رو با دوستانت به اشتراک بگذار</div>
            </div>
            <div class="players-section">
                <div class="players-header">
                    <span>👥 بازیکنان</span>
                    <span class="players-count" id="playersCount">${room.players.length}/${room.maxPlayers || 8}</span>
                </div>
                <div class="players-list" id="playersList">
                    ${playersHtml}
                </div>
            </div>
            <div class="room-settings">
                <div class="setting-row">⚙️ تنظیمات اتاق</div>
                <div class="setting-item">
                    <span>تعداد بازیکنان:</span>
                    <select id="maxPlayers" class="setting-select" onchange="updatePlayersCount()">
                        <option value="6" ${(room.maxPlayers || 8) == 6 ? 'selected' : ''}>6 نفر</option>
                        <option value="8" ${(room.maxPlayers || 8) == 8 ? 'selected' : ''}>8 نفر</option>
                        <option value="10" ${(room.maxPlayers || 8) == 10 ? 'selected' : ''}>10 نفر</option>
                    </select>
                </div>
            </div>
            <div class="room-actions">
                <button class="start-btn" id="startGameBtn" onclick="startGame()" ${room.players.length >= (room.maxPlayers || 8) ? '' : 'disabled'}>🚀 شروع بازی</button>
                <button class="leave-btn" onclick="leaveRoom()">🚪 خروج از اتاق</button>
            </div>
        </div>
    `;
    updatePlayersCount();
}

function leaveRoom() {
    const lobbyPage = document.getElementById('lobbyPage');
    const currentRoom = localStorage.getItem('currentRoom');
    if (currentRoom) {
        const rooms = JSON.parse(localStorage.getItem('rooms') || '{}');
        const room = rooms[currentRoom];
        const currentUser = localStorage.getItem('currentUser') || 'مهمان';
        if (room) {
            room.players = room.players.filter(p => p !== currentUser);
            if (room.players.length === 0) {
                delete rooms[currentRoom];
            } else {
                rooms[currentRoom] = room;
            }
            localStorage.setItem('rooms', JSON.stringify(rooms));
        }
    }
    localStorage.removeItem('currentRoom');
    lobbyPage.classList.remove('room-active');
    lobbyPage.innerHTML = `
        <div class="lobby-logo">
            <img src="avalon-logo.png" onerror="this.style.display='none'">
        </div>
        <div class="menu-title">منوی بازی</div>
        <button onclick="createRoom()">🏰 ساخت اتاق</button>
        <button onclick="showJoinRoom()">🔗 پیوستن به اتاق</button>
        <button>⚡ بازی سریع</button>
        <div class="menu-icons">
            <div class="icon" onclick="openShop()">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4H6z" stroke="#f6d37a" stroke-width="1.8"/>
                    <path d="M3 6h18" stroke="#f6d37a" stroke-width="1.8"/>
                    <path d="M16 10a4 4 0 0 1-8 0" stroke="#f6d37a" stroke-width="1.8"/>
                </svg>
            </div>
            <div class="icon" onclick="openSettings()">
                <svg viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="3" stroke="#f6d37a" stroke-width="1.8"/>
                    <path d="M12 5.5V2M12 22v-3.5M18.5 12H22M2 12h3.5M16.5 7.5L19 5M5 19l2.5-2.5M7.5 7.5L5 5M19 19l-2.5-2.5" stroke="#f6d37a" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </div>
        </div>
    `;
    showToast('از اتاق خارج شدی 🔙', 'success');
}

function startGame() {
    const maxPlayers = document.getElementById('maxPlayers');
    showToast(`بازی با ${maxPlayers ? maxPlayers.value : 6} نفر شروع شد! 🎮`, 'success');
}
</script>
</body>
</html>
